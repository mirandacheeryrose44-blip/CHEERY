<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #BEF3F9, #BED0F9);
            min-height: 100vh;
            color: black;
            padding-bottom: 30px;
        }

        /* HEADER */
        header {
            background: #ECBEF9;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            font-size: 34px;
        }

        /* NAVIGATION */
        nav {
            background: #F363F8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        nav a:hover {
            background: #9146d8;
            transform: translateY(-3px);
        }

        /* CONTACT FORM */
        .contact-container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            background: rgba(255,255,255,0.35);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .contact-container h2 {
            text-align: center;
            color: black;
            margin-bottom: 25px;
            font-size: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: none;
        }

        /* BUTTONS */
        button,
        .logout-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 20px auto 0;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #FA8FF4;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button:hover,
        .logout-btn:hover {
            transform: scale(1.03);
        }

        /* MOBILE */
        @media (max-width: 600px) {

            body {
                padding-bottom: 20px;
            }

            header {
                padding: 25px 10px;
            }

            header h1 {
                font-size: 26px;
            }

            nav {
                gap: 5px;
                padding: 10px 5px;
            }

            nav a {
                padding: 8px 9px;
                font-size: 11px;
            }

            .contact-container {
                width: calc(100% - 20px);
                margin: 25px auto;
                padding: 22px 17px;
                border-radius: 12px;
            }

            .contact-container h2 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            label {
                font-size: 14px;
            }

            input,
            textarea {
                padding: 12px;
                font-size: 14px;
            }

            textarea {
                height: 120px;
            }

            button,
            .logout-btn {
                font-size: 14px;
                padding: 12px;
            }
        }

        /* VERY SMALL PHONES */
        @media (max-width: 380px) {

            header h1 {
                font-size: 23px;
            }

            nav a {
                font-size: 10px;
                padding: 7px 8px;
            }

            .contact-container {
                padding: 20px 15px;
            }

            .contact-container h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>For More Information</h1>
    </header>

    <nav>
        <a href="home page.html">🏠 Home</a>
        <a href="Product.html">👉 Product</a>
        <a href="about page.html">👤 About</a>
        <a href="Contact.html">📞 Contact</a>
        <a href="Login form semi.html">🔐 Logout</a>
    </nav>

    <div class="contact-container">

        <h2>Contact Us</h2>

        <form onsubmit="sendMessage(event)">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                placeholder="Write your message..."
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

            <a href="Login form semi.html" class="logout-btn">
                🔐 Logout
            </a>

        </form>

    </div>

    <script>
        function sendMessage(event) {
            event.preventDefault();

            alert("Thank you! Your message has been submitted.");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        }
    </script>

</body>
</html>
