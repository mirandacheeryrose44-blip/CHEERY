<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #EF8FFA;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            padding: 30px 25px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            text-align: center;
            color: black;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h2 {
            margin: 0 0 20px;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            color: black;
            outline: none;
        }

        input::placeholder {
            color: black;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #F527D6;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #e018c0;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Extra adjustment for small phones */
        @media (max-width: 400px) {
            .login-box {
                max-width: 320px;
                padding: 25px 20px;
            }

            .login-logo {
                width: 70px;
                height: 70px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="logo.jpg" alt="Logo" class="login-logo">

        <h2>Login Form</h2>

        <form id="loginForm">

            <input 
                type="text" 
                id="username" 
                placeholder="Enter username"
                required
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>

            <div id="errorMsg" class="error-message">
                Incorrect username or password.
            </div>

        </form>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            var error = document.getElementById("errorMsg");

            if (user === "cheery" && pass === "miranda") {

                error.style.display = "none";

                // Go to homepage
                window.location.href = "home.html";

            } else {

                error.style.display = "block";

            }
        });
    </script>

</body>
</html>
