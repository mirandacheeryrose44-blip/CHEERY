<DOCTYPE html>
 <html lang="en">
 <head>
 <title>Login form</title>
 <style> 
  * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
			
        }
        body {
		    margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
			background-color: #EF8FFA;
            background-size: cover;
            background-position: center;
        }
        .login-box {
            width: 350px;
            padding: 35px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 15px;
            text-align: center;
            color: black;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        /* Style for your new logo */
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 60%;
            margin-bottom: 25px;
            object-fit: cover;
        }
        h1 {
            margin-bottom: 25px;
            margin-top: 0;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            color: black;
            outline: none;
        }
        input::placeholder {
            color: black;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #F527D6;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }


</style>
<div class="login-container">
		<form action="index.html" method="
    <div class="login-container">
	<div class="login-box">
        <!-- Logo added here. Replace 'logo.png' with your actual image path -->
        <img src="logo.jpg" alt="Logo" class="login-logo"
        <form id="loginForm" class="login-form">
          

            <div id="loginSection" class="login-container">
		<h2><big>Login Form</big></h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="btn btn-success" onclick="validateLogin()">Login</button>
        <div id="errorMsg" class="error-message"></div>
    </div>
	
	 <script>
        // Form Validation & Initial Login
        function validateLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            var error = document.getElementById("errorMsg");
            
            if (user === "cheery" && pass === "miranda") {
                error.style.display = "none";
                navigateTo('homepage');
                
                // Optional: Clear form inputs on success
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
            } else {
                error.style.display = "block";
            }
        }
		
 </script>
 
</body>
</html>
